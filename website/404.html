<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lekzio — Page Not Found</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🗣</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root{--bg:#050810;--bg-2:#080d1a;--surface:rgba(255,255,255,0.04);--border:rgba(255,255,255,0.08);--border-glow:rgba(139,92,246,0.35);--purple:#8b5cf6;--purple-light:#a78bfa;--purple-dim:rgba(139,92,246,0.15);--text:#e2e8f0;--text-muted:#64748b;--text-dim:#94a3b8;}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;}
    body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");pointer-events:none;z-index:0;opacity:0.4;}
    .content{position:relative;z-index:1;max-width:500px;}
    .glow{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);width:400px;height:300px;background:radial-gradient(ellipse,rgba(139,92,246,0.15) 0%,transparent 70%);pointer-events:none;}
    .code{font-family:'JetBrains Mono',monospace;font-size:6rem;font-weight:700;background:linear-gradient(135deg,var(--purple),#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1;margin-bottom:1rem;}
    h1{font-family:'Playfair Display',serif;font-size:clamp(1.5rem,4vw,2rem);font-weight:700;margin-bottom:0.75rem;}
    p{color:var(--text-dim);font-size:0.95rem;margin-bottom:2rem;line-height:1.6;}
    .btn-home{display:inline-block;background:linear-gradient(135deg,var(--purple),#6d28d9);color:#fff;padding:0.8rem 2rem;border-radius:10px;font-weight:600;font-size:0.95rem;text-decoration:none;box-shadow:0 0 25px rgba(139,92,246,0.35);transition:transform 0.2s,box-shadow 0.2s;}
    .btn-home:hover{transform:translateY(-2px);box-shadow:0 0 35px rgba(139,92,246,0.5);}
    .links{margin-top:1.5rem;display:flex;gap:1.5rem;justify-content:center;flex-wrap:wrap;}
    .links a{color:var(--text-muted);text-decoration:none;font-size:0.875rem;transition:color 0.2s;}
    .links a:hover{color:var(--purple-light);}
  </style>
</head>
<body>
  <div class="glow"></div>
  <div class="content">
    <div class="code">404</div>
    <h1>Page Not Found</h1>
    <p>The page you're looking for doesn't exist or has been moved. Let's get you back on track.</p>
    <a href="index.html" class="btn-home">← Back to Home</a>
    <div class="links">
      <a href="features.html">Features</a>
      <a href="about.html">About</a>
      <a href="faq.html">FAQ</a>
      <a href="contact.html">Contact</a>
      <a href="register.html">Get Started</a>
    </div>
  </div>
</body>
</html>
